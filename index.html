<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Typing Speed Test</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <img
            src="./assets/images/logo-small.svg"
            alt="Typing Speed Test logo"
            class="header-logo"
          />
          <div class="header-title">
            <h1>Typing Speed Test</h1>
            <p class="subtitle">Type as fast as you can in 60 seconds</p>
          </div>
        </div>
        <div class="header-right">
          <img
            src="./assets/images/icon-personal-best.svg"
            alt="trophy"
            class="trophy-icon"
          />
          <p class="personal-best">
            Personal best: <span id="personal-best">--</span
            ><span class="wpm-label"> &nbsp;WPM</span>
          </p>
        </div>
      </header>

      <!-- Stats + Settings on the same row -->
      <div class="toolbar">
        <div class="stats">
          <div class="stat">WPM: <strong id="wpm">--</strong></div>
          <span class="divider"></span>
          <div class="stat">Accuracy: <strong id="accuracy">--%</strong></div>
          <span class="divider"></span>
          <div class="stat">Time: <strong id="timer">--</strong></div>
        </div>

        <div class="settings">
          <div class="setting-group">
            <span class="setting-label">Difficulty:</span>
            <div class="setting-options">
              <button class="setting-btn active" data-difficulty="easy">
                Easy
              </button>
              <button class="setting-btn" data-difficulty="medium">
                Medium
              </button>
              <button class="setting-btn" data-difficulty="hard">Hard</button>
            </div>
            <span class="divider"></span>
          </div>

          <div class="setting-group">
            <span class="setting-label">Mode:</span>
            <div class="setting-options">
              <button class="setting-btn active" data-mode="timed">
                Timed (60s)
              </button>
              <button class="setting-btn" data-mode="passage">Passage</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Typing area -->
      <div class="typing-area">
        <div class="passage" id="passage">
          <!-- Text injected by JavaScript -->
        </div>
      </div>

      <!-- Bottom bar -->
      <div class="bottom-bar">
        <hr class="separator" />
        <button id="restart-btn">
          Restart Test
          <img src="./assets/images/icon-restart.svg" alt="restart" />
        </button>
      </div>

      <!-- Results (hidden until test finishes) -->
      <div class="results" id="results" hidden>
        <h2>Test Complete!</h2>
        <p class="results-subtitle">
          Solid run. Keep pushing to beat your high score.
        </p>

        <div class="results-stats">
          <div class="result-stat">
            <span>WPM</span>
            <strong id="result-wpm">--</strong>
          </div>
          <div class="result-stat">
            <span>Accuracy</span>
            <strong id="result-accuracy">--%</strong>
          </div>
          <div class="result-stat">
            <span>Characters</span>
            <strong id="result-chars">--/--</strong>
          </div>
        </div>

        <button id="go-again-btn">Go Again</button>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">CodeYellie</a>.
    </footer>

    <script src="script.js"></script>
  </body>
</html>
